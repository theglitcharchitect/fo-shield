<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fo-Shield — Vault Lifecycle Loop</title>
<style>
  :root{
    --paper:#f6f4ee; --paper2:#ffffff; --ink:#232a35; --muted:#6d7480;
    --soft:#9aa1ad; --rule:#d9d4c7; --accent:#bf4520; --store:#e9edf2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  .wrap{overflow-x:auto;min-width:1200px;padding:24px 32px 8px;}
  svg{display:block;width:1200px;height:auto;}
  .ttl{font-size:26px;font-weight:700;letter-spacing:.02em;}
  .sub{font-size:13px;fill:var(--muted);}
  .node{fill:var(--paper2);stroke:var(--rule);stroke-width:1.5;}
  .node.store{fill:var(--store);}
  .node.focal{fill:var(--accent);stroke:var(--accent);}
  .hub{fill:var(--paper2);stroke:var(--ink);stroke-width:2;}
  .nt{font-size:14px;font-weight:700;letter-spacing:.04em;}
  .nb{font-size:12px;fill:var(--muted);}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  .focal .nt,.focal .nb{fill:#ffffff;}
  .ht{font-size:13px;font-weight:700;letter-spacing:.06em;}
  .hb{font-size:11px;fill:var(--muted);}
  .arrow{stroke:var(--ink);stroke-width:1.5;fill:none;}
  .albl{font-size:11px;font-weight:700;letter-spacing:.1em;fill:var(--ink);}
  .alblbg{fill:var(--paper);}
  .legend{font-size:11px;fill:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
<svg id="fs-life" viewBox="0 0 1200 640" role="img" aria-labelledby="fs-life-t fs-life-d">
  <title id="fs-life-t">Fo-Shield vault lifecycle loop</title>
  <desc id="fs-life-d">Agents append to their own dated logs; the nightly custodian locks the vault, takes a git snapshot, reconciles logs into canonical files with provenance tags, and archives the processed logs.</desc>

  <text class="ttl" x="48" y="60">VAULT LIFECYCLE LOOP</text>
  <text class="sub" x="48" y="86">Collision-free multi-agent memory: many writers, one reconciler.</text>

  <!-- arrows first -->
  <g>
    <line class="arrow" x1="700" y1="140" x2="760" y2="140"/>
    <polygon points="760,140 752,136 752,144" fill="#232a35"/>
    <line class="arrow" x1="850" y1="210" x2="850" y2="370"/>
    <polygon points="850,370 846,362 854,362" fill="#232a35"/>
    <line class="arrow" x1="760" y1="420" x2="440" y2="420"/>
    <polygon points="440,420 448,416 448,424" fill="#232a35"/>
    <line class="arrow" x1="350" y1="370" x2="350" y2="210"/>
    <polygon points="350,210 346,218 354,218" fill="#232a35"/>
    <line class="arrow" x1="440" y1="160" x2="520" y2="160"/>
    <polygon points="520,160 512,156 512,164" fill="#232a35"/>
  </g>

  <!-- arrow labels -->
  <g>
    <rect class="alblbg" x="706" y="120" width="48" height="16"/>
    <text class="albl" x="730" y="132" text-anchor="middle">DAILY</text>
    <rect class="alblbg" x="862" y="282" width="48" height="16"/>
    <text class="albl" x="886" y="294" text-anchor="middle">LOCK</text>
    <rect class="alblbg" x="576" y="400" width="48" height="16"/>
    <text class="albl" x="600" y="412" text-anchor="middle">SYNC</text>
    <rect class="alblbg" x="310" y="282" width="64" height="16"/>
    <text class="albl" x="342" y="294" text-anchor="middle">PROMOTE</text>
    <rect class="alblbg" x="452" y="140" width="56" height="16"/>
    <text class="albl" x="480" y="152" text-anchor="middle">CLEAR</text>
  </g>

  <!-- ring nodes -->
  <g>
    <rect class="node store" x="520" y="90" width="180" height="100" rx="6"/>
    <text class="nt" x="610" y="122" text-anchor="middle">AGENTS APPEND</text>
    <text class="nb mono" x="610" y="144" text-anchor="middle">/logs/&lt;agent&gt;/</text>
    <text class="nb" x="610" y="164" text-anchor="middle">own dated file only</text>

    <g class="focal">
    <rect class="node focal" x="760" y="110" width="180" height="100" rx="6"/>
    <text class="nt" x="850" y="142" text-anchor="middle">CUSTODIAN LOCKS</text>
    <text class="nb mono" x="850" y="164" text-anchor="middle">fcntl.flock</text>
    <text class="nb" x="850" y="184" text-anchor="middle">exclusive, single writer</text>
    </g>

    <rect class="node" x="760" y="370" width="180" height="100" rx="6"/>
    <text class="nt" x="850" y="402" text-anchor="middle">GIT SNAPSHOT</text>
    <text class="nb" x="850" y="424" text-anchor="middle">vault state committed</text>
    <text class="nb" x="850" y="444" text-anchor="middle">before any merge</text>

    <rect class="node" x="260" y="370" width="180" height="100" rx="6"/>
    <text class="nt" x="350" y="402" text-anchor="middle">RECONCILE</text>
    <text class="nb mono" x="350" y="424" text-anchor="middle">→ /canonical/</text>
    <text class="nb mono" x="350" y="444" text-anchor="middle">[via &lt;agent_id&gt;]</text>

    <rect class="node" x="260" y="110" width="180" height="100" rx="6"/>
    <text class="nt" x="350" y="142" text-anchor="middle">ARCHIVE</text>
    <text class="nb mono" x="350" y="164" text-anchor="middle">/logs/_archived/</text>
    <text class="nb" x="350" y="184" text-anchor="middle">processed logs rest</text>
  </g>

  <!-- hub -->
  <g>
    <circle class="hub" cx="600" cy="290" r="64"/>
    <text class="ht" x="600" y="284" text-anchor="middle">NIGHTLY</text>
    <text class="hb mono" x="600" y="304" text-anchor="middle">custodian.py</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="48" y="560" width="14" height="14" fill="#bf4520"/>
    <text class="legend" x="68" y="572">single-writer lock (focal)</text>
    <rect x="268" y="560" width="14" height="14" fill="#e9edf2" stroke="#d9d4c7"/>
    <text class="legend" x="288" y="572">append-only store</text>
    <text class="legend" x="48" y="596">Race-condition overwrites are impossible: agents never touch /canonical or each other's logs.</text>
  </g>
</svg>
</div>
</body>
</html>
